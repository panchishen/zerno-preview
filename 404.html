<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музей зерна — страница не найдена</title>
<meta name="description" content="Страница не найдена. С главной страницы Музея зерна можно попасть в любой раздел.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prosto+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- сквозные хедер и футер: разметку вставляет chrome.js -->
<link rel="stylesheet" href="assets/chrome.css">
<!-- поля форм, календарь и модалка бронирования -->
<link rel="stylesheet" href="assets/vendor/air-datepicker.css">
<link rel="stylesheet" href="assets/forms.css">
<link rel="stylesheet" href="assets/booking.css">
<!-- подсказка по наведению: атрибут data-tooltip на любом элементе -->
<link rel="stylesheet" href="assets/tooltip.css">
<!-- база внутренних страниц: токены, кнопки, hero, карточки -->
<link rel="stylesheet" href="assets/page.css">
<script src="assets/vendor/air-datepicker.js" defer></script>
<script src="assets/vendor/air-datepicker-ru.js" defer></script>
<script src="assets/forms.js" defer></script>
<script src="assets/booking.js" defer></script>
<script src="assets/tooltip.js" defer></script>
<script src="assets/chrome.js" defer></script>
<script src="assets/page.js" defer></script>
<!-- демпфер scroll-driven анимаций: chrome.js зовёт createScrub у стики-шапки -->
<script src="assets/scrub.js"></script>
<script>(function(){var w=document.documentElement.clientWidth;if(w>0)document.documentElement.style.setProperty('--vw',w+'px');})();</script>
<style>
/* ==========================================================================
   404 (макет 1073:1855). Общее — в assets/page.css, здесь только сам экран.
   Колос рисуется штрихом, как иконки карточек музея на главной: у каждого пути
   pathLength=1, штрих длиной в весь путь сдвинут за его конец, анимация возвращает
   сдвиг к нулю. Порядок — снизу вверх: стебель, три пары листьев, остриё.
   ========================================================================== */
/* Экран занимает всё, что осталось между шапкой и футером, — иначе футер полез бы вверх:
   контента тут на треть страницы. Остаток отдаёт flex, а не вычитание высоты футера:
   с фиксированной цифрой страница на 1px превышала экран и получала полосу прокрутки */
body{ min-height:100svh; display:flex; flex-direction:column }
main{ flex:1 0 auto; display:flex; flex-direction:column }
.e404{
  flex:1 0 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:48px; text-align:center;
}
.e404__mark{ display:block; width:112px; height:112px; color:var(--gold-600); overflow:visible }
.e404__mark path{ fill:none; stroke:currentColor; stroke-width:2 }
.e404__text{ display:flex; flex-direction:column; align-items:center; gap:24px }
.e404__title-group{ display:flex; flex-direction:column; align-items:center; gap:12px }
.e404__label{
  margin:0; font:600 var(--fs-small)/1.3 var(--font-body);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);
}
/* заголовок тут тёмный, а не золотой, как на остальных внутренних страницах (макет 1073:1898) */
.e404__title{
  margin:0; font-family:var(--font-heading); font-weight:400; font-size:var(--fs-h2);
  line-height:1.12; letter-spacing:.08em; text-transform:uppercase; color:var(--text-primary);
}
.e404__lead{
  margin:0; width:min(720px, 100%); font-size:var(--fs-lead); line-height:1.6;
  color:var(--text-secondary); text-wrap:balance;
}

/* ===== прорастание колоса (тот же приём, что у иконок на главной) ===== */
@keyframes wheat-draw{ to{ stroke-dashoffset:0 } }
@media (prefers-reduced-motion: no-preference){
  .e404__mark path{ stroke-dasharray:1; stroke-dashoffset:1 }
  .e404__mark.in path{
    animation:wheat-draw .45s cubic-bezier(.22,.61,.21,1) forwards;
    animation-delay:calc(.35s + var(--wd, 0s)); /* .35с — чтобы сначала проступил сам знак */
  }
  /* пары листьев растут одновременно слева и справа */
  .e404__mark path:nth-child(1){ --wd:0s }                                   /* стебель */
  .e404__mark path:nth-child(2), .e404__mark path:nth-child(5){ --wd:.1s }   /* нижняя пара */
  .e404__mark path:nth-child(3), .e404__mark path:nth-child(6){ --wd:.2s }   /* средняя */
  .e404__mark path:nth-child(4), .e404__mark path:nth-child(7){ --wd:.3s }   /* верхняя */
  .e404__mark path:nth-child(8){ --wd:.4s }                                  /* остриё */
}

/* ===== адаптив ===== */
@media (max-width:1279px){ .e404{ gap:40px } }
@media (max-width:1023px){
  /* на планшете и телефоне экран может оказаться ниже контента — паддинг держит воздух сверху и снизу */
  .e404{ padding-block:clamp(72px, 12vw, 120px) }
  .e404__mark{ width:96px; height:96px }
}
@media (max-width:767px){
  .e404{ gap:32px }
  .e404__mark{ width:72px; height:72px }
  .e404__text{ gap:16px }
  .e404__title-group{ gap:8px }
}
</style>
</head>

<body data-header="static">

<main>

<!-- без класса .section: его отступы (200px сверху и снизу) здесь лишние —
     высоту экрана держит min-height у .e404 -->
<section class="e404 container">
  <svg class="e404__mark reveal" viewBox="0 0 64 64" aria-hidden="true">
    <path pathLength="1" d="M32 62L32 54"/>
    <path pathLength="1" d="M32 52C32 45.3726 37.3726 40 44 40H46V42C46 48.6274 40.6274 54 34 54H32V52Z"/>
    <path pathLength="1" d="M32 40C32 33.3726 37.3726 28 44 28H46V30C46 36.6274 40.6274 42 34 42H32V40Z"/>
    <path pathLength="1" d="M32 28C32 21.3726 37.3726 16 44 16H46V18C46 24.6274 40.6274 30 34 30H32V28Z"/>
    <path pathLength="1" d="M32 52C32 45.3726 26.6274 40 20 40H18V42C18 48.6274 23.3726 54 30 54H32V52Z"/>
    <path pathLength="1" d="M32 40C32 33.3726 26.6274 28 20 28H18V30C18 36.6274 23.3726 42 30 42H32V40Z"/>
    <path pathLength="1" d="M32 28C32 21.3726 26.6274 16 20 16H18V18C18 24.6274 23.3726 30 30 30H32V28Z"/>
    <path pathLength="1" d="M33.3135 21.3847C37.9998 16.6984 37.9998 9.10042 33.3135 4.41413L31.8993 2.99992L30.4851 4.41413C25.7988 9.10043 25.7988 16.6984 30.4851 21.3847L31.8993 22.7989L33.3135 21.3847Z"/>
  </svg>
  <div class="e404__text reveal">
    <div class="e404__title-group">
      <p class="e404__label">Ошибка 404</p>
      <h1 class="e404__title">Такой страницы нет</h1>
    </div>
    <p class="e404__lead">Возможно, в&nbsp;адресе опечатка или страницу перенесли. С&nbsp;главной можно попасть в&nbsp;любой раздел.</p>
  </div>
  <a class="btn btn--primary reveal" href="index.html">На главную</a>
</section>

</main>

<div class="booking" id="booking" role="dialog" aria-modal="true" aria-labelledby="booking-title"
     data-state="form" aria-hidden="true">
  <div class="booking__card">
    <button class="booking__close" type="button" data-booking-close aria-label="Закрыть окно"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 5.4 14.6 4 10 8.6 5.4 4 4 5.4 8.6 10 4 14.6 5.4 16 10 11.4 14.6 16 16 14.6 11.4 10z"/></svg></button>
    <div class="booking__form-wrap">
      <h2 class="booking__title" id="booking-title">Бронирование</h2>
      <form class="booking-form" novalidate>
        <label class="field">
          <input class="field__control" type="text" name="name" placeholder="Введите имя" autocomplete="name" required>
          <span class="field__hint"></span>
        </label>
        <label class="field">
          <input class="field__control" type="tel" name="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel" data-phone required>
          <span class="field__hint"></span>
        </label>
        <label class="field field--icon">
          <span class="field__box">
            <select class="field__control" name="subject" required>
              <option value="" disabled selected>Что бронируете?</option>
              <option>Экскурсию в музей</option>
              <option>Столик в ресторане</option>
              <option>Место на мастер-класс</option>
            </select>
            <span class="field__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15.4 5.3 8.7l1.4-1.4 5.3 5.3 5.3-5.3 1.4 1.4z"/></svg></span>
          </span>
          <span class="field__hint"></span>
        </label>
        <div class="booking-form__row">
          <label class="field">
            <input class="field__control" type="text" name="guests" placeholder="Посетителей" data-guests required>
            <span class="field__hint"></span>
          </label>
          <label class="field field--icon">
            <span class="field__box">
              <input class="field__control" type="text" name="date" placeholder="дд.мм.гггг" data-date required>
              <span class="field__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zM4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9H4zm16-2V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v1h16z"/><path d="M7 12h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2zM7 16h2v2H7zm4 0h2v2h-2z"/></svg></span>
            </span>
            <span class="field__hint"></span>
          </label>
        </div>
        <button class="btn btn--primary" type="submit">Забронировать</button>
        <div class="booking__consent">
          <div class="booking__consent-row">
            <input class="checkbox" type="checkbox" id="booking-consent" name="consent" autocomplete="off" data-consent required>
            <label class="booking__consent-text" for="booking-consent">Даю согласие на&nbsp;обработку моих персональных данных в&nbsp;соответствии с&nbsp;<a href="#" data-soon>политикой обработки персональных данных</a></label>
          </div>
          <span class="field__hint"></span>
        </div>
      </form>
    </div>
    <div class="booking__success">
      <div class="booking__success-head">
        <h2 class="booking__title">Заявка принята!</h2>
        <p class="booking__success-text">Мы свяжемся с&nbsp;вами в&nbsp;ближайшее рабочее время, чтобы подтвердить заявку и&nbsp;уточнить детали.</p>
      </div>
      <button class="btn btn--primary" type="button" data-booking-close>Закрыть</button>
    </div>
  </div>
</div>

</body>
</html>
